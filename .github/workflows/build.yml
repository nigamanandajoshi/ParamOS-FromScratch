name: Build & Boot ParamOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            nasm \
            gcc \
            binutils \
            make \
            xorriso \
            grub-pc-bin \
            grub-common \
            qemu-system-x86 \
            qemu-utils

      - name: Build ParamOS
        run: make all

      - name: Verify kernel binary exists
        run: |
          echo "Build artifacts:"
          ls -lh *.bin *.iso *.elf 2>/dev/null || ls -lh build/ 2>/dev/null || echo "Listing all output files..."
          find . -name "*.bin" -o -name "*.iso" -o -name "*.elf" | head -20

      - name: Boot test in QEMU (headless, 3s timeout)
        run: |
          timeout 3 qemu-system-i386 \
            -nographic \
            -no-reboot \
            -serial stdio \
            -m 32M \
            -kernel kernel.bin 2>&1 | tee boot_output.txt || true
          echo "--- Boot output ---"
          cat boot_output.txt
          # Verify we at least got past bootloader
          grep -q "." boot_output.txt && echo "BOOT: OK - kernel produced output" || echo "BOOT: No output (check kernel path)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paramos-build
          path: |
            *.bin
            *.iso
            *.elf
            boot_output.txt
          retention-days: 7
