name: Build & Boot ParamOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            nasm \
            gcc \
            gcc-multilib \
            binutils \
            make \
            xorriso \
            grub-pc-bin \
            grub-common \
            qemu-system-x86 \
            qemu-utils

      - name: Build ParamOS
        run: make CC=gcc LD=ld ASM=nasm OBJCOPY=objcopy all

      - name: Verify kernel binary exists
        run: |
          echo "Build artifacts:"
          ls -lh build/*.bin build/*.elf 2>/dev/null || echo "Listing all output files..."
          find . -name "*.bin" -o -name "*.iso" -o -name "*.elf" | head -20

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paramos-build
          path: |
            build/*.bin
            build/*.elf
          retention-days: 7
